<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cerne.pro — Content</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.registerPreviewStyle(`
      body { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; line-height: 1.65; color: #1a1b1e; padding: 24px; max-width: 720px; }
      img, video { max-width: 100%; height: auto; border-radius: 6px; display: block; margin: 16px 0; }
      h1, h2, h3, h4, h5, h6 { font-weight: 700; letter-spacing: -0.01em; margin: 28px 0 12px; }
      h1 { font-size: 1.9rem; }
      h2 { font-size: 1.5rem; }
      h3 { font-size: 1.2rem; }
      p { margin: 0 0 16px; }
      pre { background: #f5f4f0; border: 1px solid #d8d5cc; padding: 12px 16px; border-radius: 6px; overflow-x: auto; }
      code { font-family: ui-monospace, monospace; font-size: 0.9em; }
      p code, li code { background: #f5f4f0; padding: 2px 6px; border-radius: 4px; }
      blockquote { border-left: 3px solid #e89a3c; padding-left: 14px; color: #5a5852; margin: 16px 0; }
      table { border-collapse: collapse; width: 100%; margin: 0 0 16px; }
      th, td { border: 1px solid #d8d5cc; padding: 6px 10px; text-align: left; }
    `, { raw: true });
  </script>
</body>
</html>
